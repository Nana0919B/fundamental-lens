<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2228%22%3EF%3C/text%3E%3C/svg%3E"><title>历史估值回测 · FundAnalyst</title><link rel="stylesheet" href="/backtest.css"></head><body>
<header><a href="/">FundAnalyst / 公司研究</a><span>本地研究工具 · USD / HKD</span></header>
<main><div class="heading"><div><p class="eyebrow">HISTORICAL VALUATION LAB</p><h1>内在价值，放回历史检验</h1><p>用当时已公开的年报估值，下一交易日执行。看清买卖依据，也看见错过的行情。</p></div><a id="download" hidden>下载完整记录 JSON ↓</a></div>
<form id="form"><div class="fields"><label>估值假设<select id="assumption-source"><option value="default">研究页默认假设</option><option value="saved" disabled>关联历史研究的已保存假设</option></select></label><label>股票<select id="tickers"><option value="ALL">AAPL + MSFT + NVDA</option><option value="HK">港股十二行业 · 10 家试验 / 3 家不适用</option><option>AAPL</option><option>MSFT</option><option>NVDA</option><option value="1308.HK">1308.HK · 海丰国际</option><option value="0700.HK">0700.HK · 腾讯控股</option><option value="0941.HK">0941.HK · 中国移动</option><option value="0291.HK">0291.HK · 华润啤酒</option><option value="0883.HK">0883.HK · 中国海洋石油</option><option value="2899.HK">2899.HK · 紫金矿业</option><option value="0669.HK">0669.HK · 创科实业</option><option value="0002.HK">0002.HK · 中电控股</option><option value="1211.HK">1211.HK · 比亚迪股份</option><option value="1177.HK">1177.HK · 中国生物制药</option></select></label><label>开始日期<input id="start" type="date" value="2015-01-01" required></label><label>结束日期<input id="end" type="date" value="2025-12-31" required></label><label>历史观察日<input id="inspect_date" type="date" value="2020-03-23" required></label><label>初始资金 / 每只股票<input id="capital" type="number" value="100000" min="100" max="1000000000" required></label><label>买入安全边际 %<input id="safety_margin" type="number" value="20" min="0" max="80" required></label><label>每边费用 / 基点<input id="cost_bps" type="number" value="10" min="0" max="100" required></label></div><div class="actions"><p>低于悲观估值 × (1−安全边际) 买入 · 高于乐观估值卖出 · 其余持有原仓位</p><button id="run" type="submit">运行历史验证 →</button></div></form>
<p id="status" role="status">正在读取本地记录…</p><div class="archive"><label>已有回测 <select id="history"><option value="">选择记录</option></select></label></div>
<section id="results" hidden><h2>策略与买入持有</h2><p>各股票分别独立模拟，并非组合。现金收益为 0；分红不再投资；期末未强制卖出。</p><div id="comparison"></div><div class="tabs" id="tabs"></div><div id="detail"></div></section>
<details class="method" open><summary>模型与边界：读结果前请先看</summary><div id="method"><p>年报披露次日起可用；仅用原始申报，未补足的字段会阻止估值，绝不拿今天的财务数据回填。</p></div></details>
</main><script src="/backtest.js"></script></body></html>
